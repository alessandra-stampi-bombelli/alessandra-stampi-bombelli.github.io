<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alessandra Stampi-Bombelli - CV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fff;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .header-links {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .back-link {
            color: #0066cc;
            text-decoration: none;
            font-size: 0.95em;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .download-btn {
            background: #0066cc;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.95em;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .download-btn:hover {
            background: #0052a3;
        }

        .pdf-container {
            width: 100%;
            height: 800px;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }

        .pdf-container embed {
            width: 100%;
            height: 100%;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #666;
            font-size: 0.9em;
            text-align: center;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 1.5em;
            }

            .header-links {
                flex-direction: column;
                align-items: flex-start;
            }

            .pdf-container {
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Curriculum Vitae</h1>
        <div class="header-links">
            <a href="index.html" class="back-link">← Back to homepage</a>
            <a href="figures/CV/Alessandra_Stampi-Bombelli_CV.pdf" download class="download-btn">⬇ Download PDF</a>
        </div>
    </header>

    <div class="pdf-container">
        <embed src="figures/CV/Alessandra_Stampi-Bombelli_CV.pdf" type="application/pdf">
    </div>

    <footer>
        <p>© <span id="year"></span> Alessandra Stampi-Bombelli</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
